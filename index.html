<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario virtual · Finalizado</title>
<style>
  html,body{margin:0;height:100%;background:#fbf4ec;}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Arial,sans-serif;}
  img{max-width:100vw;max-height:100vh;width:auto;height:auto;display:block;}
  .txt{display:none;text-align:center;color:#141a3a;padding:2rem;font-size:clamp(1.4rem,4vw,2.6rem);font-weight:800;line-height:1.3;}
  .txt span{background:#7a1430;color:#fff;border-radius:.4em;padding:.05em .4em;}
</style>
</head>
<body>
<img id="cartel" src="Cuestionario%20virtual%20finalizado%2C%20notas%20disponibles.png" alt="El cuestionario virtual finalizó el 18/11/2026. Las notas ya están disponibles en su plataforma.">
<div class="txt">El cuestionario <span>virtual</span> finalizó el <span>18/11/2026.</span><br>Las notas ya están disponibles en su plataforma.</div>
<script>
  var alt=['Cuestionario%20virtual%20finalizado%20notas%20disponibles.png','img/Cuestionario_virtual_finalizado_notas_disponibles.png','img/Cuestionario%20virtual%20finalizado%20notas%20disponibles.png'];
  var im=document.getElementById('cartel');
  im.onerror=function(){ if(alt.length){ im.src=alt.shift(); } else { im.style.display='none'; document.querySelector('.txt').style.display='block'; } };
  if(im.complete && im.naturalWidth===0){ im.onerror(); }
</script>
</body>
</html>
